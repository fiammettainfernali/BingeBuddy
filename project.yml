# XcodeGen spec — Codemagic runs `xcodegen generate` to turn this text file into a real
# BingeBuddy.xcodeproj on the cloud Mac. We maintain THIS file, never the binary project.
name: BingeBuddy

options:
  bundleIdPrefix: com.jessesmith
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "6UYHJ5YC3V"            # your Apple Developer Team ID

targets:
  BingeBuddy:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jessesmith.bingebuddy
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BingeBuddy
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        TARGETED_DEVICE_FAMILY: "1"           # iPhone only
        CODE_SIGN_STYLE: Manual
