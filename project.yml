# XcodeGen spec — Codemagic runs `xcodegen generate` to turn this text file into a real
# BingeBuddy.xcodeproj on the cloud Mac. We maintain THIS file, never the binary project.
name: BingeBuddy

options:
  bundleIdPrefix: com.jessesmith
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

settings:
  base:
    MARKETING_VERSION: "0.9.3"
    CURRENT_PROJECT_VERSION: "16"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "6UYHJ5YC3V"            # your Apple Developer Team ID

targets:
  BingeBuddy:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources
    dependencies:
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseAuth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jessesmith.bingebuddy
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BingeBuddy
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO   # only standard HTTPS — skips the export-compliance prompt
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Unlock your private vault with Face ID."
        TARGETED_DEVICE_FAMILY: "1"           # iPhone only
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
