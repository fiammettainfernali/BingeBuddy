# Codemagic CI/CD — builds BingeBuddy on a cloud Mac and ships to TestFlight.
#
# One-time setup in the Codemagic UI (see README "Codemagic setup"):
#   1. Connect this GitHub repo.
#   2. App Store Connect API key integration in Codemagic named: Codemagic02
#   3. Add an environment variable group named "bingebuddy" containing:
#        - TMDB_READ_TOKEN   (your TMDB v4 Read Access Token — mark as Secure)
#        - APP_STORE_APP_ID  (the app's numeric Apple ID from App Store Connect)
#
# After that, every push to main triggers a build.

workflows:
  ios-testflight:
    name: BingeBuddy → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic02
    environment:
      groups:
        - bingebuddy
      vars:
        XCODE_PROJECT: "BingeBuddy.xcodeproj"
        XCODE_SCHEME: "BingeBuddy"
        BUNDLE_ID: "com.jessesmith.bingebuddy"
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Inject secrets
        script: |
          cat > Sources/Support/Secrets.swift <<EOF
          enum Secrets {
              static let tmdbReadToken = "$TMDB_READ_TOKEN"
          }
          EOF

      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Set build number from TestFlight
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null | tail -n 1 || true)
          case "$LATEST" in (*[!0-9]*|'') LATEST=0;; esac
          NEXT=$((LATEST + 1))
          echo "Latest TestFlight build: $LATEST → using $NEXT"
          sed -i '' -E "s/CURRENT_PROJECT_VERSION: \"[0-9]+\"/CURRENT_PROJECT_VERSION: \"$NEXT\"/" project.yml
          grep CURRENT_PROJECT_VERSION project.yml

      - name: Generate Xcode project from project.yml
        script: |
          xcodegen generate

      - name: Run unit tests
        script: |
          DEVICE=$(xcrun simctl list devices available | grep -oE "iPhone [0-9][^(]*" | head -1 | xargs)
          if [ -z "$DEVICE" ]; then echo "No iPhone simulator found"; exit 1; fi
          echo "Testing on simulator: $DEVICE"
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme BingeBuddyTests \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO

      - name: Set up code signing
        script: |
          set -ex
          keychain initialize
          # Create/fetch the App Store cert (using OUR private key, so it's reusable across
          # builds) and the provisioning profile for our bundle id.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create \
            --verbose
          keychain add-certificates
          xcode-project use-profiles --verbose
          echo "===== DIAGNOSTICS ====="
          echo "--- Provisioning profiles on disk ---"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" 2>/dev/null || echo "NONE FOUND"
          echo "--- Code signing identities in keychain ---"
          security find-identity -v -p codesigning || true
          echo "--- Signing-related build settings ---"
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -showBuildSettings 2>/dev/null \
            | grep -Ei "CODE_SIGN|PROVISIONING|DEVELOPMENT_TEAM|PRODUCT_BUNDLE" || true

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

      - name: Upload dSYMs to Crashlytics
        ignore_failure: true   # unsymbolicated crashes are better than a failed build
        script: |
          set -x
          UPLOADER=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type f -name upload-symbols -path "*firebase-ios-sdk*" | head -1)
          if [ -z "$UPLOADER" ]; then
            echo "upload-symbols not found in SPM checkout; skipping"
            exit 0
          fi
          find build/ios/xcarchive -type d -name "*.dSYM" | while read -r DSYM; do
            "$UPLOADER" -gsp Sources/Support/GoogleService-Info.plist -p ios "$DSYM"
          done

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal
